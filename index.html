<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JR Capture | Event Videography &amp; Photography UK</title>
  <meta name="description" content="Bespoke event videography and photography covering the whole of the UK" />

  <!-- Open Graph -->
  <meta property="og:title" content="JR Capture | Event Videography &amp; Photography UK" />
  <meta property="og:description" content="Bespoke event videography and photography covering the whole of the UK" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="" />
  <meta property="og:image" content="" />
  <meta property="og:site_name" content="JR Capture" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet" />

  <style>
    /* ─── Colour Palette ─────────────────────────────────────────── */
    :root {
      --black:        #0a0a0a;
      --black-soft:   #111111;
      --white:        #ffffff;
      --grey-mid:     #888888;
      --grey-light:   #e0e0e0;
      --grey-border:  #2a2a2a;
    }

    /* ─── Reset ──────────────────────────────────────────────────── */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* ─── Base ───────────────────────────────────────────────────── */
    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      background-color: var(--black);
      color: var(--white);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    img, video {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ul, ol {
      list-style: none;
    }

    /* ─── Navigation ─────────────────────────────────────────────── */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 2.5rem;
      background-color: transparent;
      border-bottom: 1px solid transparent;
      transition: background-color 0.35s ease, border-color 0.35s ease, padding 0.35s ease;
    }

    .nav.scrolled {
      background-color: var(--black);
      border-bottom-color: var(--grey-border);
      padding-top: 1rem;
      padding-bottom: 1rem;
    }

    .nav__brand {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 1.4rem;
      letter-spacing: 0.02em;
      color: var(--white);
    }

    .nav__links {
      display: flex;
      align-items: center;
      gap: 2.5rem;
    }

    .nav__links a {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .nav__links a:hover {
      opacity: 0.6;
    }

    .nav__hamburger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.25rem;
    }

    .nav__hamburger span {
      display: block;
      width: 24px;
      height: 1.5px;
      background-color: var(--white);
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center;
    }

    /* Hamburger → X */
    .nav__hamburger.open span:nth-child(1) {
      transform: translateY(6.5px) rotate(45deg);
    }
    .nav__hamburger.open span:nth-child(2) {
      opacity: 0;
      transform: scaleX(0);
    }
    .nav__hamburger.open span:nth-child(3) {
      transform: translateY(-6.5px) rotate(-45deg);
    }

    /* Mobile menu drawer */
    .nav__mobile {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 99;
      background-color: var(--black);
      padding: 5rem 2.5rem 2rem;
      border-bottom: 1px solid var(--grey-border);
      transform: translateY(-100%);
      transition: transform 0.35s ease;
    }

    .nav__mobile.open {
      transform: translateY(0);
    }

    .nav__mobile ul {
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    .nav__mobile ul a {
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      font-size: 1rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--white);
      text-decoration: none;
      transition: opacity 0.2s ease;
    }

    .nav__mobile ul a:hover {
      opacity: 0.6;
    }

    @media (max-width: 768px) {
      .nav__links {
        display: none;
      }

      .nav__hamburger {
        display: flex;
      }

      .nav__mobile {
        display: block;
      }
    }

    /* ─── Hero ───────────────────────────────────────────────────── */
    #hero {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--black);
      text-align: center;
      padding: 2rem 1.5rem;
      overflow: hidden;
    }

    .hero__heading {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 4rem;
      line-height: 1.15;
      color: var(--white);
      max-width: 820px;
      margin-bottom: 0.75rem;
    }

    .hero__line {
      width: 80px;
      height: 1px;
      background-color: var(--white);
      margin: 1.5rem auto 1.75rem;
      animation: pulse-line 3s ease-in-out infinite;
    }

    @keyframes pulse-line {
      0%, 100% { opacity: 1;   width: 80px;  }
      50%       { opacity: 0.3; width: 140px; }
    }

    .hero__sub {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: 1.1rem;
      color: var(--grey-mid);
      max-width: 500px;
      margin-bottom: 2.5rem;
      line-height: 1.7;
    }

    .hero__cta {
      display: inline-block;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--black);
      background-color: var(--white);
      border: 1px solid var(--white);
      padding: 0.9rem 2.25rem;
      border-radius: 0;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .hero__cta:hover {
      background-color: var(--black);
      color: var(--white);
    }

    @media (max-width: 768px) {
      .hero__heading {
        font-size: 2.4rem;
      }

      .hero__sub {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <a href="#hero" class="nav__brand">JR Capture</a>

    <ul class="nav__links" role="list">
      <li><a href="#hero">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#gallery">Work</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <button class="nav__hamburger" aria-label="Toggle menu" aria-expanded="false" id="hamburger">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </nav>

  <!-- Mobile menu drawer -->
  <div class="nav__mobile" id="mobile-menu" aria-hidden="true">
    <ul role="list">
      <li><a href="#hero"     class="mobile-link">Home</a></li>
      <li><a href="#about"    class="mobile-link">About</a></li>
      <li><a href="#services" class="mobile-link">Services</a></li>
      <li><a href="#gallery"  class="mobile-link">Work</a></li>
      <li><a href="#contact"  class="mobile-link">Contact</a></li>
    </ul>
  </div>

  <!-- Hero -->
  <section id="hero">
    <h1 class="hero__heading">Capturing Moments That Last Forever</h1>
    <div class="hero__line" aria-hidden="true"></div>
    <p class="hero__sub">Bespoke Event Videography &amp; Photography Across the UK</p>
    <a href="#gallery" class="hero__cta">View Our Work</a>
  </section>

  <section id="about"></section>

  <section id="services"></section>

  <section id="gallery"></section>

  <section id="stats"></section>

  <section id="contact"></section>

  <footer id="footer"></footer>

  <script>
    // ── Nav: transparent → solid on scroll ──────────────────────────
    const nav = document.querySelector('.nav');
    const hero = document.getElementById('hero');

    const observer = new IntersectionObserver(
      ([entry]) => nav.classList.toggle('scrolled', !entry.isIntersecting),
      { threshold: 0.1 }
    );
    observer.observe(hero);

    // ── Hamburger toggle ─────────────────────────────────────────────
    const hamburger   = document.getElementById('hamburger');
    const mobileMenu  = document.getElementById('mobile-menu');
    const mobileLinks = document.querySelectorAll('.mobile-link');

    function closeMenu() {
      hamburger.classList.remove('open');
      mobileMenu.classList.remove('open');
      hamburger.setAttribute('aria-expanded', 'false');
      mobileMenu.setAttribute('aria-hidden', 'true');
    }

    hamburger.addEventListener('click', () => {
      const isOpen = hamburger.classList.toggle('open');
      mobileMenu.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', String(isOpen));
      mobileMenu.setAttribute('aria-hidden', String(!isOpen));
    });

    mobileLinks.forEach(link => link.addEventListener('click', closeMenu));
  </script>
</body>
</html>
